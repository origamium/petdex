name: desktop packaging ci

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-*.yml"
      - "scripts/*desktop*"
      - "scripts/*macos*"
      - "scripts/*native*"
      - "patches/native-sdk-*.patch"
      - "packages/petdex-desktop-native/app.*"
      - "packages/petdex-desktop-native/Makefile"
      - "packages/petdex-desktop-native/packaging/**"
  push:
    paths:
      - ".github/workflows/desktop-*.yml"
      - "scripts/*desktop*"
      - "scripts/*macos*"
      - "scripts/*native*"
      - "patches/native-sdk-*.patch"
      - "packages/petdex-desktop-native/app.*"
      - "packages/petdex-desktop-native/Makefile"
      - "packages/petdex-desktop-native/packaging/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts/desktop-release.test.ts
      - name: Check current manifests and SDK pins
        run: |
          VERSION=$(bun -e 'console.log((await Bun.file("packages/petdex-desktop-native/app.package.json").json()).version)')
          bun scripts/verify-desktop-release.ts "desktop-v$VERSION"
      - run: bash -n scripts/sign-macos.sh scripts/setup-native-packager.sh

  macos-preview:
    needs: release-checks
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Build the tested runtime SDK
        run: |
          make -C packages/petdex-desktop-native sdk
          REF=$(sed -n 's/^ *NATIVE_SDK_REF: "\(.*\)"$/\1/p' .github/workflows/desktop-native-ci.yml | head -n 1)
          SDK="$HOME/.cache/petdex/native-sdk-$REF"
          echo "NATIVE_SDK_PATH=$SDK" >> "$GITHUB_ENV"
          echo "NATIVE_CLI=$SDK/zig-out/bin/native" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the pinned DMG packager
        run: scripts/setup-native-packager.sh
      - name: Exercise packaging without release credentials
        run: scripts/sign-macos.sh "$RUNNER_TEMP/preview" arm64 --unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: macos-packaging-preview-NOT-FOR-DISTRIBUTION
          path: |
            ${{ runner.temp }}/preview/*-unsigned.dmg
            ${{ runner.temp }}/preview/*-unsigned.zip
          if-no-files-found: error
          retention-days: 7
